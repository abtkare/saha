# ساحة — نسخة المعاينة
# مؤقتاً: المنفذ 8097 مكشوف مباشرة (http://72.61.18.234:8097) لأن وكيل هوستنجر
# لا يملك صلاحية الكتابة في /etc/nginx ولا تثبيت Certbot.
# في جلسة النشر (8) نعيده إلى "8097:80" خلف Nginx مع HTTPS (infra/nginx/saha.conf).
name: saha

services:
  preview:
    image: ghcr.io/abtkare/saha-preview:latest
    container_name: saha-preview
    restart: unless-stopped
    ports:
      - "8097:80"
    networks:
      - saha_net
    mem_limit: 128m

networks:
  saha_net:
    name: saha_net
