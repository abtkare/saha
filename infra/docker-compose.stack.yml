# «ساحة» الكاملة على السيرفر (قاعدة + Redis + خادم + موقع) من صور جاهزة على GHCR.
# المجلد على السيرفر: /docker/saha-stack  — ملف .env بجانبه (انظر .env.example).
# المنفذ المكشوف: HOST_HTTP_PORT (افتراضياً 8098). المعاينة القديمة تبقى على 8097.
# الجلسة 8: saha-backup (نسخة يومية للقاعدة في /docker/saha-stack/backups)
#           saha-edge (HTTPS على https://saha.72-61-18-234.sslip.io عبر Nginx الموجود — ملف موقع جديد لساحة وحدها).
name: saha-stack

services:
  db:
    image: postgres:16-alpine
    container_name: saha-db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Baghdad
    volumes: [saha_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 30
    networks: [saha_net]
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    container_name: saha-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb"]
    volumes: [saha_redis:/data]
    networks: [saha_net]
    mem_limit: 96m

  api:
    image: ghcr.io/abtkare/saha-api:latest
    pull_policy: always   # زر Update في Docker Manager يسحب آخر نسخة دائماً
    container_name: saha-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [saha_uploads:/data/uploads]
    networks: [saha_net]
    mem_limit: 384m

  web:
    image: ghcr.io/abtkare/saha-web:latest
    pull_policy: always   # زر Update في Docker Manager يسحب آخر نسخة دائماً
    container_name: saha-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      NOINDEX: "true"
    depends_on: [api]
    ports:
      - "${HOST_HTTP_PORT:-8098}:3000"
    networks: [saha_net]
    mem_limit: 256m

  # نسخة احتياطية يومية للقاعدة (الساعة 03 بتوقيت بغداد) + نسخة عند أول تشغيل، وتُحذف الأقدم من 14 يوماً.
  # الملفات: /docker/saha-stack/backups/saha-YYYY-MM-DD_HHMM.sql.gz — تظهر في مدير ملفات هوستنجر.
  backup:
    image: postgres:16-alpine
    container_name: saha-backup
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Baghdad
      PGHOST: db
      BACKUP_HOUR: "03"
      BACKUP_KEEP_DAYS: "14"
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - /docker/saha-stack/backups:/backups
    networks: [saha_net]
    mem_limit: 128m
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        backup() {
          f="/backups/saha-$$(date +%Y-%m-%d_%H%M).sql.gz"
          if pg_dump --no-owner --clean --if-exists | gzip -9 > "$$f.part" && [ -s "$$f.part" ]; then
            mv "$$f.part" "$$f"; echo "[$$(date '+%F %T')] ✅ نسخة احتياطية: $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.part"; echo "[$$(date '+%F %T')] ❌ فشل النسخ الاحتياطي"; return 1
          fi
          find /backups -name 'saha-*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -print -delete
        }
        [ "$${BACKUP_ONCE:-}" = 1 ] && { backup; exit $$?; }
        echo "[$$(date '+%F %T')] النسخ الاحتياطي يعمل: يومياً الساعة $$BACKUP_HOUR:00 بتوقيت بغداد، والاحتفاظ $$BACKUP_KEEP_DAYS يوماً"
        [ -n "$$(find /backups -name 'saha-*.sql.gz' -mtime -1 2>/dev/null)" ] || backup || true
        while true; do
          if [ "$$(date +%H)" = "$$BACKUP_HOUR" ] && ! ls /backups/saha-"$$(date +%Y-%m-%d)"_*.sql.gz >/dev/null 2>&1; then backup || true; fi
          sleep 600
        done

  # HTTPS: يضيف لـ Nginx الموجود على السيرفر ملف موقع واحداً لساحة فقط، ويصدر شهادة Let's Encrypt ويجددها.
  # يفحص كل المواقع الأخرى (خصوصي، مشاوي…) قبل كل تغيير وبعده، ويتراجع تلقائياً إن تأثر أي منها.
  # الشرح الكامل في apps/api/ops/edge.sh. سجلّه يظهر في Docker Manager ← saha-stack ← saha-edge ← Logs.
  edge:
    image: ghcr.io/abtkare/saha-api:latest
    pull_policy: always
    container_name: saha-edge
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    environment:
      SAHA_DOMAIN: saha.72-61-18-234.sslip.io
      SAHA_UPSTREAM: 127.0.0.1:${HOST_HTTP_PORT:-8098}
      SAHA_DIR: /docker/saha-stack
      # طوارئ: غيّر "0" إلى "1" ثم Deploy ← يحذف ملف ساحة من Nginx وحده ويعيده كما كان (ساحة تبقى على :8098)
      SAHA_EDGE_REMOVE: "0"
    entrypoint: ["bash", "/repo/apps/api/ops/edge.sh"]
    healthcheck: { disable: true }
    depends_on: [web]
    mem_limit: 64m

volumes:
  saha_db: { name: saha_db }
  saha_redis: { name: saha_redis }
  saha_uploads: { name: saha_uploads }

networks:
  saha_net:
    name: saha_net
    external: true
