name: الفحص والبناء

on:
  push:
    branches: [main]
    paths-ignore: ["apps/preview/**", "docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: الاختبارات وقاعدة البيانات
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saha
          POSTGRES_PASSWORD: saha
          POSTGRES_DB: saha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saha" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://saha:saha@localhost:5432/saha
      SHADOW_DATABASE_URL: postgresql://saha:saha@localhost:5432/saha_shadow
      ADMIN_EMAIL: admin@saha.local
      ADMIN_INITIAL_PASSWORD: ci_only_password
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: تثبيت الحزم
        run: pnpm install --no-frozen-lockfile

      - name: البناء (shared, ui, api, web)
        run: pnpm build

      - name: تطابق الـ migrations مع schema.prisma
        working-directory: apps/api
        run: |
          psql "postgresql://saha:saha@localhost:5432/saha" -c "CREATE DATABASE saha_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --script > /tmp/drift.sql
          if [ -s /tmp/drift.sql ] && grep -qvE '^(-- This is an empty migration\.|\s*)$' /tmp/drift.sql; then
            echo "::error title=اختلاف بين schema.prisma والـ migrations::$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/drift.sql)"
            cat /tmp/drift.sql; exit 1
          fi

      - name: تطبيق الـ migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: اختبار سجل التدقيق ونوع البطولة
        working-directory: apps/api
        run: pnpm test

      - name: زرع البيانات التجريبية (مرتين للتأكد أنه لا يكرر)
        working-directory: apps/api
        run: node dist/prisma/seed.js && node dist/prisma/seed.js

      - name: فحص الأنواع للاختبارات
        working-directory: apps/api
        run: npx tsc -p tsconfig.json --noEmit

      - name: تشغيل الخادم وفحص الـ API
        working-directory: apps/api
        run: |
          node dist/src/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/v1/health && break; sleep 1; done
          curl -sf localhost:3001/api/v1/tournaments | node -e "
            const t = JSON.parse(require('fs').readFileSync(0));
            const kinds = new Set(t.map(x => x.kind));
            console.log('بطولات:', t.length, [...kinds]);
            if (t.length !== 3 || kinds.size !== 3) process.exit(1);"
          curl -sf "localhost:3001/api/v1/tournaments?kind=facebook_group" | grep -q hilla-group-cup
          psql "$DATABASE_URL" -tAc "SELECT ok FROM audit_verify()" | grep -q t
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:3001/api/v1/tournaments?kind=xx"); test "$code" = 400

      - name: إظهار الأخطاء
        if: failure()
        run: |
          [ -f /tmp/api.log ] && tail -50 /tmp/api.log || true

      - name: حفظ ملف القفل pnpm-lock.yaml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "تحديث pnpm-lock.yaml تلقائياً [skip ci]"
            git pull --rebase origin main && git push
          fi

  mobile:
    name: التطبيق (Expo) — الأنواع والاختبارات والبناء
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env: { CI: "1", EXPO_NO_TELEMETRY: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund
      - name: تطابق الإصدارات مع Expo SDK
        run: npx expo install --check || (echo "::warning title=إصدارات Expo::بعض الحزم لا تطابق إصدارات SDK" && true)
      - name: فحص الأنواع
        run: npx tsc --noEmit
      - name: اختبارات المنطق
        run: npm test
      - name: البناء (expo export)
        run: npx expo export --platform ios --platform android --no-bytecode --output-dir dist && ls dist && cat dist/metadata.json | head -c 400
      - name: حفظ package-lock.json للمراجعة
        uses: actions/upload-artifact@v4
        with: { name: mobile-lock, path: apps/mobile/package-lock.json }

  stack:
    name: التشغيل بأمر واحد ورفع الصور
    needs: [test, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up --build
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: فحص الموقع والـ API عبر منفذ واحد
        run: |
          curl -sf localhost:8098/api/v1/health
          html=$(curl -sf localhost:8098/)
          echo "$html" | grep -q "كل جمهور يستحق بطولته"
          echo "$html" | grep -q "بطولة ساحات بغداد الشعبية"
          curl -sf localhost:8098/tournaments/baghdad-sahat-2026 | grep -q "شباب الكرادة"
          curl -sf "localhost:8098/api/v1/matches" | grep -q homeTeam
          curl -sf "localhost:8098/api/v1/tournaments/baghdad-sahat-2026/standings" | grep -q points
          # الجلسة 12: طريق التأهل وأفضل اللاعبين
          curl -sf "localhost:8098/api/v1/tournaments/baghdad-sahat-2026/road" | grep -q '"bracket"'
          curl -sf "localhost:8098/api/v1/tournaments/baghdad-sahat-2026/stars" | grep -q '"bestPlayers"'
          curl -sf localhost:8098/tournaments/baghdad-sahat-2026 | grep -q 'أفضل اللاعبين'
          curl -sf "localhost:8098/api/v1/news" | grep -q saha-launch
          echo "$html" | grep -q 'class="splash'
          echo "$html" | grep -q 'البطولات الجارية'
          # الجلسة 6: صفحات الموقع العام واللوحة وبوابة الراعي
          echo "$html" | grep -q 'theme-btn'
          curl -sf localhost:8098/tournaments | grep -q 'متابعو المؤثرين'
          curl -sf "localhost:8098/tournaments?kind=facebook_group" | grep -q 'بطولة أعضاء مجموعة شباب الحلة'
          curl -sf localhost:8098/news | grep -q 'saha-launch'
          curl -sf localhost:8098/news/saha-launch | grep -q 'كل جمهور يستحق بطولته'
          mid=$(curl -sf localhost:8098/api/v1/tournaments/baghdad-sahat-2026 | node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(0)).matches[0].id))")
          tid=$(curl -sf localhost:8098/api/v1/tournaments/baghdad-sahat-2026 | node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(0)).registrations[0].team.id))")
          curl -sf localhost:8098/matches/$mid | grep -q 'حالة النتيجة'
          curl -sf localhost:8098/teams/$tid | grep -q 'اللاعبون'
          curl -sf localhost:8098/sponsor | grep -q 'اطلب التواصل'
          curl -sf localhost:8098/terms | grep -q 'الشروط'
          curl -sf localhost:8098/privacy | grep -q 'الخصوصية'
          curl -sf localhost:8098/app | grep -q 'تطبيق ساحة'
          curl -sf localhost:8098/admin > /dev/null
          # الجلسة 7: خادم التطبيق لـ Expo Go
          curl -sf localhost:8098/app | grep -q 'exp://localhost:8098/expo'
          curl -sf localhost:8098/app | grep -q 'exp://u.expo.dev/e971c618-1a3d-49f3-8c3d-ddf5bd31ce29?runtime-version=exposdk%3A58.0.0&amp;channel-name=production'
          m=$(curl -sf -H 'expo-platform: ios' -H 'accept: application/expo+json,application/json' localhost:8098/expo)
          echo "$m" | head -c 600; echo
          echo "$m" | grep -q '"runtimeVersion":"exposdk:58'
          echo "$m" | grep -q '"apiUrl":"http://localhost:8098/api/v1"'
          bundle=$(echo "$m" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0)).launchAsset.url)")
          curl -sf "$bundle" | head -c 200 > /dev/null
          curl -sf -o /dev/null localhost:8098/expo-app/fonts/Cairo_800ExtraBold.ttf
          curl -sf -H 'expo-platform: android' -H 'accept: multipart/mixed' localhost:8098/expo | grep -q 'name="manifest"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'accept: text/html' localhost:8098/expo); test "$code" = 307
          curl -sf localhost:8098/sponsor/portal > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8098/matches/999999); test "$code" = 404
          curl -sf -X POST localhost:8098/api/v1/sponsor-leads -H 'content-type: application/json' \
            -d '{"fullName":"اختبار CI","phone":"07701234567","orgName":"شركة"}' | grep -q 'وصل طلبك'

      - name: "الجلسة 8/9: مشروع saha-ops — النسخ الاحتياطي والاسترجاع (من ملف السيرفر نفسه وبنفس مساراته)"
        timeout-minutes: 6
        run: |
          set -x
          # ملف التشغيل الرئيسي: أربع خدمات فقط (backup وedge في saha-ops حتى لا تتكرر الأسماء)
          cp .env.example infra/.env
          test "$(docker compose -f infra/docker-compose.stack.yml config --services | sort | tr '\n' ' ')" = "api db redis web "
          rm infra/.env
          docker run --rm --entrypoint cat ghcr.io/abtkare/saha-api:dev /repo/infra/docker-compose.stack.yml | cmp - infra/docker-compose.stack.yml
          # الرابط العام لزر Compose from URL: الموقع يقدّم الملف حرفياً، ونسخة الطوارئ تختلف في سطر واحد فقط
          curl -sf localhost:8098/ops/saha-ops.yml | cmp - infra/docker-compose.ops.yml
          curl -sf localhost:8098/ops/saha-ops-remove.yml > /tmp/remove.yml
          test "$(diff infra/docker-compose.ops.yml /tmp/remove.yml | grep -c '^[<>]')" = 2
          grep -q 'SAHA_EDGE_REMOVE: "1"' /tmp/remove.yml
          # نفس مسارات السيرفر: /docker/saha-stack/.env و/docker/saha-stack/backups
          sudo mkdir -p /docker/saha-stack/backups
          printf '%s\n' POSTGRES_USER=saha POSTGRES_DB=saha POSTGRES_PASSWORD=saha_dev_only | sudo tee /docker/saha-stack/.env >/dev/null
          test "$(docker compose -f infra/docker-compose.ops.yml config --services | sort | tr '\n' ' ')" = "backup edge "
          docker compose -f infra/docker-compose.ops.yml config --format json > /tmp/ops.json
          node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/ops.json'));process.stdout.write(c.services.backup.command[0].replace(/\\$\\$/g,'\$'))" > /tmp/backup.sh
          ! grep -F '$$' /tmp/backup.sh
          grep -qF '${BACKUP_ONCE:-}' /tmp/backup.sh
          sh -n /tmp/backup.sh
          # تشغيل فعلي لخدمة backup كما سيشغّلها Docker Manager (مشروع منفصل على الشبكة saha_net)
          docker compose -f infra/docker-compose.ops.yml up -d backup
          for i in $(seq 1 45); do docker logs saha-backup 2>&1 | grep -q '✅ نسخة احتياطية' && break; sleep 2; done
          docker logs saha-backup
          docker logs saha-backup 2>&1 | grep -q 'النسخ الاحتياطي يعمل'
          docker logs saha-backup 2>&1 | grep -q '✅ نسخة احتياطية'
          docker compose -f infra/docker-compose.ops.yml down
          docker ps --format '{{.Names}}' | grep -qx saha-db
          f=$(ls /docker/saha-stack/backups/saha-*.sql.gz | head -1); ls -la /docker/saha-stack/backups; test -s "$f"
          # الاسترجاع في قاعدة جديدة، ثم المقارنة وسلامة سجل التدقيق
          q() { docker exec -i saha-db psql -U saha -v ON_ERROR_STOP=1 -At "$@"; }
          q -d saha -c "CREATE DATABASE saha_restore"
          gunzip -c "$f" | q -d saha_restore -q > /dev/null
          for t in users tournaments teams matches audit_log hero_slides posts; do
            a=$(q -d saha -c "SELECT count(*) FROM $t"); b=$(q -d saha_restore -c "SELECT count(*) FROM $t")
            echo "$t: $a ← $b"; test "$a" = "$b"
          done
          test "$(q -d saha_restore -c 'SELECT count(*) FROM audit_log')" -gt 0
          q -d saha_restore -c "SELECT ok, checked, reason FROM audit_verify()"
          test "$(q -d saha_restore -c 'SELECT ok FROM audit_verify()')" = t
          # الاسترجاع فوق قاعدة موجودة (حالة الطوارئ) يعمل أيضاً بفضل --clean
          gunzip -c "$f" | q -d saha_restore -q > /dev/null
          test "$(q -d saha_restore -c 'SELECT ok FROM audit_verify()')" = t

      - name: "الجلسة 8: HTTPS عبر Nginx الموجود دون المساس بالمواقع الأخرى"
        timeout-minutes: 10
        run: |
          set -x
          command -v nginx || { sudo apt-get update -qq && sudo apt-get install -y -qq nginx; }
          # موقع آخر يمثّل «خصوصي» على 80 و443 (كما على السيرفر)
          sudo mkdir -p /etc/nginx/other && cd /etc/nginx/other
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=khousousi.test -keyout k.pem -out c.pem 2>/dev/null
          printf '%s\n' 'server { listen 80; server_name khousousi.test; location / { return 200 "khousousi-ok"; } }' \
            'server { listen 443 ssl; server_name khousousi.test; ssl_certificate /etc/nginx/other/c.pem; ssl_certificate_key /etc/nginx/other/k.pem; location / { return 200 "khousousi-tls"; } }' \
            | sudo tee /etc/nginx/conf.d/khousousi.conf
          cd -
          sudo nginx -t && (sudo systemctl restart nginx || sudo nginx)
          other() { curl -sk --resolve khousousi.test:80:127.0.0.1 --resolve khousousi.test:443:127.0.0.1 "$1://khousousi.test/"; }
          test "$(other http)" = khousousi-ok && test "$(other https)" = khousousi-tls
          D=saha.127-0-0-1.sslip.io
          edge() { docker run --rm --privileged --pid=host --network=host -e SAHA_DOMAIN=$D -e SAHA_DIR=/tmp/saha-edge \
            -e SAHA_ACME=selfsigned -e SAHA_EDGE_ONCE=1 "$@" --entrypoint bash ghcr.io/abtkare/saha-api:dev /repo/apps/api/ops/edge.sh; }
          site() { curl -sk --resolve $D:443:127.0.0.1 --resolve $D:80:127.0.0.1 "$@"; }
          # 1) أول تشغيل: إعداد HTTP ← شهادة ← HTTPS
          edge -e SAHA_UPSTREAM=127.0.0.1:8098 > /tmp/edge1.log 2>&1 || { cat /tmp/edge1.log; exit 1; }
          cat /tmp/edge1.log
          grep -q '🎉' /tmp/edge1.log
          # الموقع الآخر رُصد قبل التغيير وبعده بنفس الرمز
          grep -q 'khousousi.test http=200 https=200' /tmp/edge1.log
          site https://$D/api/v1/health | grep -q '"status":"ok"'
          site https://$D/ | grep -q 'كل جمهور يستحق بطولته'
          site https://$D/app | grep -q 'u.expo.dev'
          test "$(site -o /dev/null -w '%{http_code}' http://$D/tournaments)" = 301
          site -I https://$D/ | grep -qi strict-transport-security
          test "$(other http)" = khousousi-ok && test "$(other https)" = khousousi-tls
          # 2) إعادة التشغيل (زر Update) لا تغيّر شيئاً
          edge -e SAHA_UPSTREAM=127.0.0.1:8098 > /tmp/edge2.log 2>&1 || { cat /tmp/edge2.log; exit 1; }
          cat /tmp/edge2.log
          grep -q 'لا تغيير' /tmp/edge2.log
          # 3) إعداد خاطئ ← nginx -t يرفضه ← تراجع تلقائي وساحة والموقع الآخر يعملان كما كانا
          if edge -e "SAHA_UPSTREAM=127.0.0.1:8098 broken" > /tmp/edge3.log 2>&1; then cat /tmp/edge3.log; echo "كان يجب أن يفشل"; exit 1; fi
          cat /tmp/edge3.log
          grep -q 'أعدت Nginx كما كان' /tmp/edge3.log
          sudo nginx -t
          site https://$D/api/v1/health | grep -q '"status":"ok"'
          test "$(other http)" = khousousi-ok && test "$(other https)" = khousousi-tls
          # 4) لا يكتب فوق ملف ليس من صنعه
          sudo cp /etc/nginx/conf.d/saha-sslip.conf /tmp/saha-sslip.bak
          echo '# ملف يدوي' | sudo tee /etc/nginx/conf.d/saha-sslip.conf >/dev/null
          if edge -e SAHA_UPSTREAM=127.0.0.1:8098 > /tmp/edge4.log 2>&1; then cat /tmp/edge4.log; echo "كان يجب أن يرفض"; exit 1; fi
          cat /tmp/edge4.log
          grep -q 'ليس من صنع saha-edge' /tmp/edge4.log
          test "$(cat /etc/nginx/conf.d/saha-sslip.conf)" = '# ملف يدوي'
          sudo cp /tmp/saha-sslip.bak /etc/nginx/conf.d/saha-sslip.conf
          # 5) مفتاح الطوارئ SAHA_EDGE_REMOVE=1: يحذف ملف ساحة وحده، والموقع الآخر يبقى
          edge -e SAHA_UPSTREAM=127.0.0.1:8098 -e SAHA_EDGE_REMOVE=1 > /tmp/edge5.log 2>&1 || { cat /tmp/edge5.log; exit 1; }
          cat /tmp/edge5.log
          grep -q '🧹' /tmp/edge5.log
          sleep 2
          test ! -e /etc/nginx/conf.d/saha-sslip.conf
          sudo nginx -t
          test "$(other http)" = khousousi-ok && test "$(other https)" = khousousi-tls
          test -z "$(site https://$D/ | grep 'كل جمهور يستحق بطولته' || true)"

      - name: لقطات المقارنة البصرية (المعاينة مقابل الموقع)
        run: |
          mkdir -p shots
          (cd apps/preview/public && python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 2
          shot() { google-chrome --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
            --virtual-time-budget="${4:-15000}" --window-size="$3" --screenshot="shots/$1.png" "$2" 2>/dev/null; }
          # إطاران من شاشة البداية (الكرة ترتد، ثم الكلمة والشارات)
          shot 0-preview-splash-a http://localhost:8099/ 390,844 1900
          shot 0-web-splash-a http://localhost:8098/ 390,844 1900
          shot 0-preview-splash-b http://localhost:8099/ 390,844 3300
          shot 0-web-splash-b http://localhost:8098/ 390,844 3300
          shot 1-preview-desktop http://localhost:8099/ 1440,3100
          shot 1-web-desktop http://localhost:8098/ 1440,3100
          shot 2-preview-mobile http://localhost:8099/ 390,5200
          shot 2-web-mobile http://localhost:8098/ 390,5200
          shot 3-web-tournament http://localhost:8098/tournaments/baghdad-sahat-2026 1440,2600
          shot 4-web-tournament-mobile http://localhost:8098/tournaments/baghdad-sahat-2026 390,4400
          # الجلسة 6: الوضع الداكن والصفحات الجديدة واللوحة (بدخول مدير عام عبر TOTP)
          node .github/scripts/shots.mjs http://localhost:8099 shots --preview
          ADMIN_PASSWORD=change_me_dev node .github/scripts/shots.mjs http://localhost:8098 shots
          ls -la shots

      - name: حفظ اللقطات في الفرع ci-shots (للمقارنة من جلسة البرمجة)
        if: github.event_name != 'pull_request'
        run: |
          cd shots
          git init -q -b ci-shots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "لقطات ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots

      - name: السجلات عند الفشل
        if: failure()
        run: docker compose logs --tail 80

      - name: رفع الصور إلى GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for app in api web; do
            docker tag ghcr.io/abtkare/saha-$app:dev ghcr.io/abtkare/saha-$app:latest
            docker tag ghcr.io/abtkare/saha-$app:dev ghcr.io/abtkare/saha-$app:${{ github.sha }}
            docker push ghcr.io/abtkare/saha-$app:latest
            docker push ghcr.io/abtkare/saha-$app:${{ github.sha }}
          done
