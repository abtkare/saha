name: مختبرو TestFlight

# يضيف المختبرين الداخليين ويرسل دعوة TestFlight عبر App Store Connect API (دون دخول موقع Apple).
# التشغيل: Run workflow، أو الرفع على الفرع testflight-testers.
on:
  workflow_dispatch:
  push:
    branches: [testflight-testers]

jobs:
  testers:
    name: إضافة المختبرين وإرسال الدعوة
    runs-on: ubuntu-latest
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EXPO_ASC_API_KEY_PATH: /tmp/asc.p8
      EXPO_ASC_KEY_ID: 4X6NC7B978
      EXPO_ASC_ISSUER_ID: 61482282-93b4-43db-9e12-2a752b3b4448
      ASC_APP_ID: "6838996508"
      TESTER_EMAILS: alriyadagroup01@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$EXPO_ASC_API_KEY_PATH"
          node .github/scripts/asc-testers.mjs
