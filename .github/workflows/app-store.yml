name: نسخة TestFlight (iOS)

# يبني التطبيق على خوادم Expo (EAS Build) ويرفعه إلى App Store Connect فيظهر في TestFlight.
# التشغيل: GitHub ← Actions ← «نسخة TestFlight (iOS)» ← Run workflow، أو رفع على الفرع testflight.
# القيم غير السرية مكتوبة هنا مباشرة (ليست أسراراً):
#   الفريق: شركة عصر الريادة — Team ID 2PB3RY6HRM (حساب شركة)
#   التطبيق: «ساحة البطولات» app.saha.iq — Apple ID 6838996508
#   مفتاح App Store Connect API «EAS» (Admin) — Key ID 4X6NC7B978
# الأسرار الوحيدة في Settings ← Secrets and variables ← Actions:
#   EXPO_TOKEN   (موجود)
#   ASC_KEY_P8   محتوى ملف المفتاح AuthKey_4X6NC7B978.p8 كاملاً
on:
  workflow_dispatch:
  push:
    branches: [testflight]

jobs:
  ios:
    name: بناء iOS ورفعه إلى TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EXPO_ASC_KEY_ID: 4X6NC7B978
      EXPO_ASC_ISSUER_ID: 61482282-93b4-43db-9e12-2a752b3b4448
      EXPO_APPLE_TEAM_ID: 2PB3RY6HRM
      EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
      ASC_APP_ID: "6838996508"
      EXPO_ASC_API_KEY_PATH: /tmp/asc.p8
      SAHA_EAS: "1"
      SAHA_STORE: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
      SAHA_WEB_URL: https://saha.72-61-18-234.sslip.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: التحقق من الأسرار
        run: |
          miss=""
          for v in EXPO_TOKEN ASC_KEY_P8; do [ -n "${!v}" ] || miss="$miss $v"; done
          [ -z "$miss" ] || { echo "::error title=أسرار ناقصة::$miss"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$EXPO_ASC_API_KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$EXPO_ASC_API_KEY_PATH" && grep -q "END PRIVATE KEY" "$EXPO_ASC_API_KEY_PATH" || { echo "::error title=ASC_KEY_P8::النص لا يبدأ بـ BEGIN PRIVATE KEY أو لا ينتهي بـ END PRIVATE KEY"; exit 1; }
          node -e "const f='eas.json',j=JSON.parse(require('fs').readFileSync(f));j.submit.production.ios={ascAppId:process.env.ASC_APP_ID,appleTeamId:process.env.EXPO_APPLE_TEAM_ID,ascApiKeyPath:process.env.EXPO_ASC_API_KEY_PATH,ascApiKeyId:process.env.EXPO_ASC_KEY_ID,ascApiKeyIssuerId:process.env.EXPO_ASC_ISSUER_ID};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: شهادة التوزيع وملف التعريف (App Store Connect API)
        env:
          BUNDLE_ID: app.saha.iq
          OUT_DIR: /tmp/ios-cred
        run: |
          node ../../.github/scripts/asc-signing.mjs
          node -e "const f='eas.json',j=JSON.parse(require('fs').readFileSync(f));j.build.production.credentialsSource='local';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: تثبيت الحزم وأداة EAS
        run: |
          npm install --no-audit --no-fund
          npm install -g eas-cli@latest --no-audit --no-fund
          eas whoami
      - name: البناء على خوادم Expo (نحو 20–40 دقيقة)
        run: eas build --platform ios --profile production --non-interactive --wait --json > build.json && cat build.json
      - name: سبب الفشل من سجل EAS
        if: failure()
        run: |
          eas build:list --platform ios --limit 1 --json --non-interactive > last.json || exit 0
          node -e "
          const b=JSON.parse(require('fs').readFileSync('last.json'))[0]||{};
          console.log('البناء:',b.id,'الحالة:',b.status);
          console.log('الخطأ:',JSON.stringify(b.error||{}));
          require('fs').writeFileSync('logs.txt',(b.logFiles||[]).join('\\n'));"
          i=0; while read -r u || [ -n "$u" ]; do [ -n "$u" ] || continue; i=$((i+1)); curl -sSL --compressed "$u" -o "eas-log-$i" || true; node ../../.github/scripts/eas-log.mjs "eas-log-$i"; done < logs.txt
      - name: الرفع إلى App Store Connect ← TestFlight
        run: |
          id=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json'));process.stdout.write((Array.isArray(b)?b[0]:b).id)")
          eas submit --platform ios --profile production --id "$id" --non-interactive
          echo "## ✅ رُفعت النسخة إلى TestFlight — تظهر في تطبيق TestFlight بعد معالجة Apple (10–30 دقيقة)" >> "$GITHUB_STEP_SUMMARY"
